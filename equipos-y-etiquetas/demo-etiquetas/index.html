und:#0f1929;padding:14px;min-width:0}.side+ .work{border-left:1px solid var(--line)}.work+.side{border-left:1px solid var(--line)}.side h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 0 12px}.fields{display:flex;flex-wrap:wrap;gap:6px}.field{font-size:11px;color:#b9d9ff;background:#193457;border:1px solid #2c5e91;border-radius:5px;padding:6px;cursor:pointer}.equipment{display:flex;gap:7px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);font-size:12px}.equipment input{accent-color:var(--blue)}.work{position:relative;display:flex;flex-direction:column;align-items:center;background:#0e1726;padding:68px 20px 44px;overflow:auto}.toolbar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.toolbar .select{min-width:110px;padding:7px}.toolbar .input{min-width:45px;width:45px;padding:7px}.zoom{position:absolute;bottom:12px;display:flex;gap:6px;align-items:center}.zoom output{min-width:46px;text-align:center;color:var(--muted)}.stage{position:relative;flex:0 0 auto;background:#fff;box-shadow:0 18px 45px #0008}.label-el{position:absolute;display:flex;align-items:center;padding:2px;overflow:visible;white-space:pre-wrap;word-break:break-word;cursor:move}.label-el.sel{outline:2px dashed var(--blue);background:#55a7ff18}.label-el img,.label-el canvas{width:100%;height:100%;object-fit:contain;pointer-events:none}.handle{width:8px;height:8px;position:absolute;right:-5px;bottom:-5px;background:var(--blue);border:1px solid white;cursor:nwse-resize}.prop{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:12px;margin-bottom:12px}.prop input,.prop select,.prop textarea{width:100%;background:#0b1423;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px}.prop textarea{min-height:55px}.layer{display:flex;align-items:center;gap:7px;padding:9px 5px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12px}.layer.sel{background:#1a3559}.layer b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.layer span{color:var(--blue);font-size:10px}.empty{color:var(--muted);padding:20px 4px;font-size:12px}.status{font-size:11px;padding:3px 7px;border-radius:20px}.Disponible{background:#163d36;color:var(--green)}.Asignado{background:#303057;color:#b8b8ff}.Baja{background:#4b202c;color:#ff9dac}.toast{position:fixed;right:20px;bottom:20px;background:#18365a;border:1px solid var(--blue);padding:12px 15px;border-radius:8px;opacity:0;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:1100px){.layout{grid-template-columns:1fr}.table-wrap{max-height:480px}.editor{min-height:620px}}@media(max-width:760px){.layout{padding:12px}.editor{grid-template-columns:1fr}.side{max-height:210px}.work{min-height:430px;order:-1}.side+.work,.work+.side{border:0;border-top:1px solid var(--line)}}
</style>

body{background:#f2efe9;color:#1c2321;font-family:'Google Sans Flex','Segoe UI',sans-serif}.top{height:auto;min-height:58px;padding:9px 18px;background:#1c2321;color:#f2efe9;border-bottom:3px solid #c1541f}.brand{font-size:15px;letter-spacing:.02em}.brand small{background:#c1541f;color:#1c2321;padding:3px 6px;border-radius:3px;font-size:10px}.layout{display:block;padding:0;max-width:none}.layout>.card:first-child{display:none}.card{border:0;border-radius:0;background:transparent}.card>h2{display:none}.editor{display:grid;grid-template-columns:280px minmax(420px,1fr) 280px;min-height:calc(100vh - 58px);background:#fff}.side{background:#fff;color:#1c2321;padding:0;border-color:#dcd6c9}.side h3{font-size:11px;color:#8a8578;padding:14px 16px 8px;margin:0;border-top:1px solid #dcd6c9}.side h3:first-child{border-top:0}.fields{padding:6px 16px 14px}.field{font-family:Consolas,monospace;font-size:11px;background:#f3ddd0;color:#7a2f0e;border:1px solid #e6c3a9}.equipment{color:#1c2321;border-bottom:1px solid #eee8dc;padding:9px 16px}.equipment small{color:#8a8578}.work{background:#f2efe9;padding:78px 34px 48px;min-width:0}.toolbar{top:10px;left:10px;right:10px;background:#1c2321;border-radius:6px;padding:5px 8px}.toolbar .btn,.toolbar .select{border-color:#3a4441;background:#2b3330;color:#f2efe9;border-radius:5px}.toolbar .btn.primary{background:#c1541f;border-color:#c1541f;color:#fff}.stage{border:1px solid #dcd6c9;box-shadow:0 12px 28px #1c232133}.zoom{bottom:12px}.side+.work{border-left:1px solid #dcd6c9}.work+.side{border-left:1px solid #dcd6c9}.side .empty{color:#9a9689;padding:6px 16px}.layer{color:#1c2321;border-bottom:1px solid #eee8dc;padding:9px 16px}.layer.sel{background:#f3ddd0}.layer span{color:#c1541f}.layer b{font-weight:500}.prop{color:#8a8578}.prop input,.prop select,.prop textarea{background:#fbfaf7;border-color:#dcd6c9;color:#1c2321}.toast{background:#1c2321;border-color:#c1541f;color:#fff}
.stage{position:relative;z-index:0!important;pointer-events:none!important}.label-el{pointer-events:auto}.toolbar,.zoom{z-index:10!important;pointer-events:auto!important}.top{position:relative;z-index:20}

<style>
:root{--bg-color:#0f172a;--text-main:#f8fafc;--text-muted:#94a3b8;--glass-bg:rgba(30,41,59,.7);--glass-border:rgba(255,255,255,.1);--primary:#3b82f6;--primary-hover:#2563eb;--danger:#ef4444}body{background:var(--bg-color);background-image:radial-gradient(circle at 50% -20%,#1e1b4b,var(--bg-color));color:var(--text-main);font-family:'Google Sans Flex','Inter',system-ui,sans-serif}.top{height:64px;padding:12px 24px;background:rgba(15,23,42,.8);border-bottom:1px solid var(--glass-border);backdrop-filter:blur(16px)}.brand{font-size:20px}.brand small{background:var(--primary);color:#fff}.top:after{content:'Equipos    Generador QR    Usuarios y Config    Gestión de Catálogos';color:var(--text-muted);font-size:13px;white-space:pre;margin-left:26px;flex:1}.top button{background:transparent;color:var(--text-muted);border-color:var(--glass-border)}.layout{padding:24px 28px;display:grid;grid-template-columns:minmax(420px,1fr);gap:24px;max-width:none}.layout>.card:first-child{display:block}.card{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:12px;color:var(--text-main)}.card>h2{display:block;font-size:18px;padding:20px 24px;border-bottom:1px solid var(--glass-border)}.filters{padding:14px 18px}.input,.select{background:rgba(0,0,0,.2);border-color:var(--glass-border);color:var(--text-main)}th{background:rgba(30,41,59,.95);color:var(--text-muted)}th,td{border-color:var(--glass-border)}.actions button{color:var(--primary)}.actions button:last-child{color:#4ade80}.editor{background:transparent;min-height:600px}.side{background:var(--glass-bg);color:var(--text-main)}.side h3{color:var(--text-muted);border-color:var(--glass-border)}.field{background:rgba(59,130,246,.12);border-color:rgba(96,165,250,.35);color:#bfdbfe}.equipment{color:var(--text-main);border-color:var(--glass-border)}.equipment small{color:var(--text-muted)}.work{background:rgba(15,23,42,.55)}.toolbar{background:rgba(30,41,59,.9);border:1px solid var(--glass-border)}.toolbar .btn,.toolbar .select{background:transparent;border-color:var(--glass-border);color:var(--text-muted)}.toolbar .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.stage{box-shadow:0 12px 30px rgba(0,0,0,.3);border:0}.side+.work,.work+.side{border-color:var(--glass-border)}.layer{color:var(--text-main);border-color:var(--glass-border)}.layer.sel{background:rgba(59,130,246,.16)}.layer span{color:#93c5fd}.prop{color:var(--text-muted)}.prop input,.prop select,.prop textarea{background:rgba(0,0,0,.2);border-color:var(--glass-border);color:var(--text-main)}
</style>

<body>
<header class="top"><div class="brand">Demo Etiquetas <small>DATOS INVENTADOS</small></div><button id="reset">Restablecer demo</button></header>
<main class="layout">
<section class="card"><h2>Inventario de equipos</h2><div class="filters"><input class="input" id="search" placeholder="Buscar equipo..."><select class="select" id="statusFilter"><option value="">Todos los estatus</option><option>Disponible</option><option>Asignado</option><option>Baja</option></select><span id="count" style="color:var(--muted);padding:9px 2px"></span></div><div class="table-wrap"><table><thead><tr><th>Serie</th><th>Marca</th><th>Estatus</th><th>Cliente</th><th>Dirección</th><th>Acciones</th></tr></thead><tbody id="table"></tbody></table></div></section>
<section class="card"><h2>Editor de etiqueta</h2><div class="editor"><aside class="side"><h3>Campos</h3><div class="fields" id="fields"></div><h3 style="margin-top:22px">Equipos</h3><input class="input" id="equipmentSearch" placeholder="Filtrar..." style="min-width:0;width:100%;margin-bottom:8px"><div id="equipmentList"></div></aside><section class="work"><div class="toolbar"><select class="select" id="size"><option value="51x25">51 x 25 mm</option><option value="70x40">70 x 40 mm</option></select><button class="btn" id="addText">+ Texto</button><button class="btn" id="addQr">+ QR</button><button class="btn primary" id="print">Imprimir</button></div><div class="stage" id="stage"></div><div class="zoom"><button class="btn" id="zoomOut">-</button><output id="zoomLabel">100%</output><button class="btn" id="zoomIn">+</button><button class="btn" id="zoomReset">Ajustar</button></div></section><aside class="side"><h3>Propiedades</h3><div id="properties" class="empty">Selecciona un elemento.</div><h3 style="margin-top:24px">Capas</h3><div id="layers" class="empty">Sin elementos.</div></aside></div></section>
</main><div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<script>
const demoRows=[{id:1,serie:'LAP-0001',marca:'Lenovo',estatus:'Asignado',cliente:'Grupo Horizonte',cod:'CL-1001',direccion:'Av. Reforma 120, Int. 4, Centro'},{id:2,serie:'MON-0002',marca:'Dell',estatus:'Disponible',cliente:'',cod:'',direccion:''},{id:3,serie:'IMP-0003',marca:'Epson',estatus:'Baja',cliente:'',cod:'',direccion:''},{id:4,serie:'LAP-0004',marca:'HP',estatus:'Asignado',cliente:'Comercializadora Norte',cod:'CL-1004',direccion:'Calle Roble 45, Col. Industrial'}];
const clients={ 'CL-1001':{name:'Grupo Horizonte',addresses:['Av. Reforma 120, Int. 4, Centro','Blvd. Los Pinos 88, Col. Norte']},'CL-1004':{name:'Comercializadora Norte',addresses:['Calle Roble 45, Col. Industrial','Carr. Federal 12, Local 8, Las Flores']},'CL-1020':{name:'Servicios del Valle',addresses:['Av. Universidad 300, Col. Centro']}};
const fields=['serie','marca','cliente','direccion','estatus','cod_cliente'];let rows=structuredClone(demoRows);const defaultElements=()=>[
{id:'demo-serie',type:'text',x:4,y:4,w:28,h:6,fontSize:13,bold:true,align:'left',color:'#101828',bound:'serie',text:''},
{id:'demo-client',type:'text',x:4,y:11,w:28,h:6,fontSize:10,bold:false,align:'left',color:'#334155',bound:'cliente',text:''},
{id:'demo-address',type:'text',x:4,y:17,w:29,h:5,fontSize:8,bold:false,align:'left',color:'#475569',bound:'direccion',text:''},
{id:'demo-qr',type:'qr',x:37,y:4,w:12,h:12,field:'serie'},
{id:'demo-mark',type:'image',x:37,y:17,w:10,h:5,src:'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 120 50%22%3E%3Crect width=%22120%22 height=%2250%22 rx=%226%22 fill=%22%231c2321%22/%3E%3Cpath d=%22M14 37V13h7l9 13 9-13h7v24h-7V23l-9 13-9-13v14z%22 fill=%22%23f2efe9%22/%3E%3Ctext x=%2254%22 y=%2231%22 fill=%22%23f3a16d%22 font-size=%2215%22 font-family=%22Arial%22%3EDEMO%3C/text%3E%3C/svg%3E'}
];let state={elements:defaultElements(),selected:'demo-serie',zoom:1,preview:0};const $=id=>document.getElementById(id);const toast=message=>{ $('toast').textContent=message;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)};const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderTable(){const q=$('search').value.toLowerCase(),s=$('statusFilter').value;const list=rows.filter(r=>(!q||Object.values(r).some(v=>String(v).toLowerCase().includes(q)))&&(!s||r.estatus===s));$('table').innerHTML=list.map(r=>`<tr><td><b>${esc(r.serie)}</b><br><small>#${r.id}</small></td><td>${esc(r.marca)}</td><td><span class="status ${r.estatus}">${r.estatus}</span></td><td>${esc(r.cliente||'-')}</td><td>${esc(r.direccion||'-')}</td><td class="actions"><button onclick="editRow(${r.id})">Editar</button><button onclick="printRow(${r.id})">Etiqueta</button></td></tr>`).join('');$('count').textContent=`${list.length} de ${rows.length}`}
function renderFields(){$('fields').innerHTML=fields.map(f=>`<button class="field" onclick="addText('${f}')">${f}</button>`).join('')}
function renderEquipment(){const q=$('equipmentSearch').value.toLowerCase();$('equipmentList').innerHTML=rows.filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q)).map((r,i)=>`<label class="equipment"><input type="checkbox" data-id="${r.id}" ${r.selected?'checked':''}>${r.serie} <small>${r.marca}</small></label>`).join('');$('equipmentList').querySelectorAll('input').forEach(c=>c.onchange=()=>{rows.find(r=>r.id==c.dataset.id).selected=c.checked})}
function renderStage(){const stage=$('stage'),r=rows[state.preview]||{};stage.style.width=state.sizeW+'mm';stage.style.height=state.sizeH+'mm';stage.style.transform=`scale(${state.zoom})`;stage.style.transformOrigin='top left';stage.parentElement.style.setProperty('--unused','');stage.innerHTML='';state.elements.forEach((e,i)=>{const n=document.createElement('div');n.className='label-el '+(e.id===state.selected?'sel':'');n.style.cssText=`left:${e.x}mm;top:${e.y}mm;width:${e.w}mm;height:${e.h}mm;z-index:${i+1};font-size:${e.fontSize||12}px;font-weight:${e.bold?'700':'400'};color:${e.color||'#101828'};text-align:${e.align||'left'};justify-content:${e.align==='center'?'center':e.align==='right'?'flex-end':'flex-start'}`;n.onclick=()=>selectEl(e.id);if(e.type==='text')n.textContent=e.bound?String(r[e.bound]||'{{'+e.bound+'}}'):e.text;if(e.type==='qr'){const c=document.createElement('canvas');new QRious({element:c,value:String(r[e.field]||r.serie||'DEMO'),size:180});n.append(c)}const h=document.createElement('i');h.className='handle';n.append(h);stage.append(n)})}
function renderLayers(){$('layers').innerHTML=state.elements.length?state.elements.map(e=>`<div class="layer ${e.id===state.selected?'sel':''}" onclick="selectEl('${e.id}')"><span>${e.type.toUpperCase()}</span><b>${esc(e.bound||e.text||(e.type==='qr'?'Código QR':'Imagen'))}</b></div>`).join(''):'<div class="empty">Sin elementos.</div>'}
function renderProps(){const e=state.elements.find(x=>x.id===state.selected);if(!e)return $('properties').innerHTML='<div class="empty">Selecciona un elemento.</div>'; $('properties').innerHTML=`<label class="prop">Texto o campo<select id="propField"><option value="">Texto fijo</option>${fields.map(f=>`<option ${e.bound===f?'selected':''}>${f}</option>`).join('')}</select></label><label class="prop">Contenido<textarea id="propText">${esc(e.text||'')}</textarea></label><button class="btn danger" id="deleteEl">Eliminar elemento</button>`;$('propField').onchange=x=>{e.bound=x.target.value||null;renderAll()};$('propText').oninput=x=>{e.text=x.target.value;renderStage();renderLayers()};$('deleteEl').onclick=()=>{state.elements=state.elements.filter(x=>x.id!==e.id);state.selected=null;renderAll()}}
function selectEl(id){state.selected=id;renderAll()};function renderAll(){renderStage();renderLayers();renderProps()};function addText(bound=null){state.elements.push({id:'e'+Date.now()+Math.random(),type:'text',x:4,y:4+state.elements.length*6,w:30,h:6,fontSize:12,bold:false,align:'left',color:'#101828',bound,text:bound?'':'Texto demo'});state.selected=state.elements.at(-1).id;renderAll()};function addQr(){state.elements.push({id:'e'+Date.now(),type:'qr',x:35,y:3,w:13,h:13,field:'serie'});state.selected=state.elements.at(-1).id;renderAll()};
function editRow(id){const r=rows.find(x=>x.id===id);state.preview=rows.indexOf(r);toast('Equipo cargado en el editor')};function printRow(id){const r=rows.find(x=>x.id===id);rows.forEach(x=>x.selected=false);r.selected=true;state.preview=rows.indexOf(r);toast('Demo: etiqueta enviada a impresión')};function setZoom(z){state.zoom=Math.max(.5,Math.min(3,z));$('zoomLabel').textContent=Math.round(state.zoom*100)+'%';renderStage()};$('search').oninput=renderTable;$('statusFilter').onchange=renderTable;$('equipmentSearch').oninput=renderEquipment;$('addText').onclick=()=>addText();$('addQr').onclick=addQr;$('zoomIn').onclick=()=>setZoom(state.zoom+.15);$('zoomOut').onclick=()=>setZoom(state.zoom-.15);$('zoomReset').onclick=()=>setZoom(1);$('reset').onclick=()=>{state.elements=[];state.selected=null;rows=structuredClone(demoRows);renderAll();renderTable();renderEquipment();toast('Demo restablecido')};$('size').onchange=e=>{[state.sizeW,state.sizeH]=e.target.value.split('x').map(Number)};$('print').onclick=()=>toast('Demo: impresión preparada');document.addEventListener('wheel',e=>{if((e.ctrlKey||e.metaKey)&&e.target.closest('.work')){e.preventDefault();e.stopPropagation();setZoom(state.zoom+(e.deltaY<0?.15:-.15))}},{capture:true,passive:false});state.sizeW=51;state.sizeH=25;renderTable();renderFields();renderEquipment();renderAll();
</script><script>$('reset').onclick=()=>{state.elements=defaultElements();state.selected='demo-serie';rows=structuredClone(demoRows);renderTable();renderEquipment();renderAll();toast('Diseño inicial restaurado')};</script></body></html>
