{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-dark text-white py-3">
                <h4 class="mb-0"><i class="bi bi-shield-lock me-2"></i>Gestión de Passwords</h4>
            </div>
            <div class="card-body p-4">
                <p class="text-muted mb-4">Como administrador, puedes actualizar la contraseña de cualquier usuario del sistema.</p>
                
                <form action="{{ url_for('cambiar_password') }}" method="POST">
                    <div class="mb-3">
                        <label for="user_to_change" class="form-label fw-bold">Usuario a modificar</label>
                        <select class="form-select bg-light" id="user_to_change" name="user_to_change" required>
                            <option value="" selected disabled>Selecciona un usuario...</option>
                            {% for user in users %}
                            <option value="{{ user.username }}">{{ user.username }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="new_password" class="form-label fw-bold">Nueva Contraseña</label>
                            <input type="password" class="form-control bg-light" id="new_password" name="new_password" placeholder="Mínimo 5 caracteres" required minlength="5">
                        </div>
                        <div class="col-md-6">
                            <label for="confirm_password" class="form-label fw-bold">Confirmar Contraseña</label>
                            <input type="password" class="form-control bg-light" id="confirm_password" name="confirm_password" placeholder="Repite la contraseña" required>
                        </div>
                    </div>
                    
                    <hr class="my-4">
                    
                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('home') }}" class="btn btn-link text-decoration-none text-muted">Cancelar</a>
                        <button type="submit" class="btn btn-dark px-4">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="alert alert-warning mt-4 border-0 shadow-sm" role="alert">
            <i class="bi bi-info-circle-fill me-2"></i>
            Las contraseñas de los usuarios deben ser tratadas con confidencialidad. 
        </div>
    </div>
</div>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
{% endblock %}
