{% extends 'base_home.html' %}

{% block content %}
<div class="card">
    <div class="card-header bg-info text-white">
        <h4 class="mb-0 fw-bold">Nuevo Registro: Suavizador</h4>
    </div>
    <div class="card-body">
        <form action="{{ url_for('nuevo_suavizador') }}" method="POST">

            <div class="row mb-4">
                <div class="col-md-3">
                    <label class="form-label fw-bold">Fecha</label>
                    <input type="date" class="form-control" name="fecha" value="{{ hoy }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">Planta</label>
                    {% if current_user.username == 'PRODPlanta_A' %}
                    <input type="text" class="form-control bg-light" value="Planta_A" disabled>
                    <input type="hidden" name="planta" value="Planta_A">
                    {% elif current_user.username == 'PRODELEC' %}
                    <input type="text" class="form-control bg-light" value="Planta_B" disabled>
                    <input type="hidden" name="planta" value="Planta_B">
                    {% else %}
                    <select name="planta" class="form-select" required>
                        <option value="">Selecciona la planta...</option>
                        <option value="Planta_B">Planta_B</option>
                        <option value="Planta_A">Planta_A</option>
                    </select>
                    {% endif %}
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">Número de Suavizador</label>
                    <select class="form-select" name="numero_suavizador" required>
                        <option value="">Selecciona...</option>
                        <option value="1">Suavizador 1</option>
                        <option value="2">Suavizador 2</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">Hora del Monitoreo</label>
                    <select class="form-select" name="hora_monitoreo" required>
                        <option value="">Selecciona turno...</option>
                        <option value="6:00 A.M.">6:00 A.M.</option>
                        <option value="7:00 A.M.">7:00 A.M.</option>
                        <option value="8:00 A.M.">8:00 A.M.</option>
                        <option value="9:00 A.M.">9:00 A.M.</option>
                        <option value="10:00 A.M.">10:00 A.M.</option>
                        <option value="11:00 A.M.">11:00 A.M.</option>
                        <option value="12:00 P.M.">12:00 P.M.</option>
                        <option value="1:00 P.M.">1:00 P.M.</option>
                        <option value="2:00 P.M.">2:00 P.M.</option>
                        <option value="3:00 P.M.">3:00 P.M.</option>
                        <option value="4:00 P.M.">4:00 P.M.</option>
                        <option value="5:00 P.M.">5:00 P.M.</option>
                        <option value="6:00 P.M.">6:00 P.M.</option>
                        <option value="7:00 P.M.">7:00 P.M.</option>
                        <option value="8:00 P.M.">8:00 P.M.</option>
                        <option value="9:00 P.M.">9:00 P.M.</option>

                    </select>
                </div>
            </div>

            <hr>
            <h5 class="text-info mb-3">Lectura de Dureza</h5>

            <div class="row mb-4">
                <div class="col-md-4 mb-2">
                    <div class="input-group">
                        <span class="input-group-text bg-light w-100 fw-bold">Gotas (5 - 30)</span>
                        <input type="number" step="1" class="form-control" name="gotas" placeholder="Número de gotas"
                            required>
                    </div>
                </div>
            </div>

            <div class="text-end mt-4">
                <a href="{{ url_for('suavizador_index') }}" class="btn btn-secondary me-2">Cancelar</a>
                <button type="submit" class="btn btn-info text-white fw-bold">
                    <i class="bi bi-save"></i> Guardar Registro
                </button>
            </div>

        </form>
    </div>
</div>

{% endblock %}
