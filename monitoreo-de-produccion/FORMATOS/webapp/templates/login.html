{% extends 'base_home.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card border-0 shadow-lg">
            <div class="card-header bg-primary text-white text-center py-4 border-0">
                <h3 class="mb-0">Iniciar Sesión</h3>
                <p class="mb-0 opacity-75">Control de Formatos e Indicadores</p>
            </div>
            <div class="card-body p-5">
                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-4 text-center">
                        <i class="bi bi-person-circle display-1 text-primary"></i>
                    </div>
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold">Usuario</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control bg-light border-start-0" id="username"
                                name="username" placeholder="Ingresa tu usuario" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control bg-light border-start-0" id="password"
                                name="password" placeholder="••••••••" required>
                        </div>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">Acceder</button>
                    </div>
                </form>
            </div>
            <div class="card-footer bg-white border-0 text-center pb-4">
                <small class="text-muted">Si tienes problemas para acceder, contacta al administrador.</small>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
{% endblock %}
